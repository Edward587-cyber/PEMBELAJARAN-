<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Pembelajaran – Magister Teknik Elektro ITS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1216; --side:#0f151a; --card:#0f1b1f; --card2:#121f24; --line:#1f2c32; --line2:#26353c;
    --ink:#e6edf0; --text:#b9c6cc; --muted:#7d8b92; --dim:#56646b;
    --acc:#2fd08c; --accbg:#1d6e4f; --accsoft:#13382b; --warn:#e3a33b; --blue:#4c8dff;
    --mono:"JetBrains Mono",Consolas,monospace; --sans:"Fira Sans","Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;display:flex}
  ::selection{background:var(--accbg);color:#fff}
  /* ---------- sidebar ---------- */
  aside{width:324px;flex:0 0 324px;height:100vh;position:sticky;top:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{display:flex;gap:14px;align-items:center;padding:16px 18px 14px}
  .brand .logo{width:52px;height:52px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:0 0 52px}
  .brand .logo img{height:40px}
  .brand b{display:block;color:#fff;font-weight:700;font-size:17px;letter-spacing:.01em;line-height:1.2}
  .brand span{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .search{padding:4px 18px 10px}
  .search input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:8px;color:var(--ink);font:13px var(--mono);padding:9px 11px;outline:none}
  .search input:focus{border-color:var(--accbg)}
  .menu{flex:1;overflow-y:auto;padding:0 18px 10px}
  .menu::-webkit-scrollbar{width:6px}.menu::-webkit-scrollbar-thumb{background:#33434a;border-radius:3px}
  .grp{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:20px 14px 8px}
  .item{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 14px;color:var(--text);font:500 15px/1.35 var(--sans);cursor:pointer}
  .item:hover{background:#151f24;color:var(--ink)}
  .item .ic{width:18px;flex:0 0 18px;font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
  .item .pc{margin-left:auto;font:11px var(--mono);color:var(--dim)}
  .item.active{background:var(--accbg);color:#d9ffef;font-weight:600}
  .item.active .ic,.item.active .pc{color:#bff5dc}
  .item.hide{display:none}
  .sfoot{border-top:1px solid var(--line);margin:0 18px;padding:14px 0 16px}
  .sfoot .mine{display:flex;justify-content:space-between;font:500 14px var(--sans);color:var(--ink);padding:0 14px 8px}
  .bar{height:6px;background:#1b272c;border-radius:3px;overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--acc);transition:width .3s}
  .sfoot .bar{margin:0 14px 14px}
  .btn{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;background:none;border:1px solid var(--line2);border-radius:8px;color:var(--ink);font:600 14px var(--sans);padding:11px;cursor:pointer;text-decoration:none}
  .btn:hover{border-color:var(--accbg)}
  .uni{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;line-height:1.9;padding:14px 2px 0}
  /* ---------- main ---------- */
  main{flex:1;min-width:0;height:100vh;overflow-y:auto}
  .wrap{max-width:1540px;padding:16px 26px 60px}
  .eyebrow{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--acc);text-transform:uppercase}
  h1{color:#fff;font-size:40px;line-height:1.2;font-weight:700;margin:8px 0 16px;letter-spacing:-.01em}
  .rule{border:0;border-top:1px solid var(--line2);margin:0 0 24px}
  .lead{font-size:19px;color:var(--text);max-width:820px;margin:0 0 32px}
  h2{color:#fff;font-size:22px;font-weight:600;margin:36px 0 18px}
  .note{color:var(--text);font-size:16px;margin:14px 0 0}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:8px 20px}
  .r{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:11px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:16px}
  .r:last-child{border-bottom:0}
  .r .k{color:var(--text)}
  .r .v{color:#fff;font-weight:700;text-align:right;white-space:nowrap}
  .r .v.ok{color:var(--acc)} .r .v.run{color:var(--warn)}
  .r.topic{justify-content:flex-start;cursor:pointer;align-items:flex-start}
  .r.topic .w{color:var(--muted);flex:0 0 120px}
  .r.topic .t{color:var(--ink);flex:1;font-family:var(--sans);font-size:16px;line-height:1.5}
  .r.topic .ck{flex:0 0 auto;margin-left:auto;font-weight:700;color:var(--dim);white-space:nowrap}
  .r.topic.done .t{color:var(--muted)}
  .r.topic.done .ck{color:var(--acc)}
  .r.topic:hover .t{color:#fff}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:16px 20px}
  .kpi .v{font:700 30px var(--mono);color:#fff}
  .kpi .l{font:12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .two{grid-template-columns:1fr 1fr}
  .tag{display:inline-block;font:12px var(--mono);color:var(--acc);background:var(--accsoft);border-radius:5px;padding:2px 8px;margin:0 6px 6px 0}
  .path{font:13px var(--mono);color:var(--text);background:#0b1215;border:1px solid var(--line);border-radius:8px;padding:12px 14px;word-break:break-all}
  .clink{cursor:pointer}.clink:hover .k{color:#fff}
  .chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .chain .n{font:13px var(--mono);color:var(--ink);background:var(--card2);border:1px solid var(--line2);border-radius:6px;padding:6px 10px}
  .chain .a{color:var(--acc);font-family:var(--mono)}
  .thread{padding:16px 0;border-bottom:1px solid var(--line)}.thread:last-child{border-bottom:0}
  .thread b{color:#fff;font-size:17px}
  .tl .r .k{display:flex;gap:14px;align-items:center}
  .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--acc);flex:0 0 10px}
  .dot.done{background:var(--acc)} .dot.now{border-color:var(--warn);background:var(--warn)} .dot.plan{border-color:var(--dim)}
  mark{background:#5c4a12;color:#fff;padding:0 2px;border-radius:2px}

  /* ---------- drive ---------- */
  .dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:36px 0 14px}
  .dhead h2{margin:0}
  .live{font:12px var(--mono);color:var(--muted);display:flex;gap:8px;align-items:center}
  .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 #2fd08c88;animation:pl 2s infinite}
  .live.err .pulse{background:#e5534b;animation:none}
  @keyframes pl{0%{box-shadow:0 0 0 0 #2fd08c88}70%{box-shadow:0 0 0 8px #2fd08c00}100%{box-shadow:0 0 0 0 #2fd08c00}}
  .sbtn{background:none;border:1px solid var(--line2);border-radius:7px;color:var(--ink);font:500 13px var(--mono);padding:7px 12px;cursor:pointer}
  .sbtn:hover{border-color:var(--acc);color:#fff}
  .sbtn.pri{background:var(--accbg);border-color:var(--accbg);color:#e6fff3}
  .crumbs{font:13px var(--mono);color:var(--muted);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
  .crumbs a{color:var(--acc);cursor:pointer;text-decoration:none}.crumbs a:hover{text-decoration:underline}
  .f{display:grid;grid-template-columns:28px 1fr 90px 110px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .f:last-child{border-bottom:0}
  .f:hover .nm{color:#fff}
  .f .ty{font:700 10px var(--mono);color:var(--bg);background:var(--muted);border-radius:4px;text-align:center;padding:3px 0}
  .f .nm{color:var(--ink);font-size:15px;word-break:break-word}
  .f .nm small{display:block;color:var(--dim);font:12px var(--mono)}
  .f .sz,.f .dt{font:12px var(--mono);color:var(--muted);text-align:right}
  .f.dir .ty{background:var(--accbg);color:#d9ffef}
  .ty.pdf{background:#d9534f!important;color:#fff!important}.ty.doc{background:#4c8dff!important;color:#fff!important}
  .ty.xls{background:#2e9b57!important;color:#fff!important}.ty.ppt{background:#e07b39!important;color:#fff!important}
  .ty.vid{background:#9b59b6!important;color:#fff!important}.ty.img{background:#c9a227!important;color:#111!important}
  .empty{color:var(--muted);font:14px var(--mono);padding:16px 0}
  .field{display:block;margin:0 0 14px}
  .field span{display:block;font:12px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .field input{width:100%;background:#0b1215;border:1px solid var(--line2);border-radius:8px;color:var(--ink);font:14px var(--mono);padding:11px 12px;outline:none}
  .field input:focus{border-color:var(--acc)}
  ol.steps{margin:0;padding-left:22px}ol.steps li{margin:8px 0}
  code{font-family:var(--mono);font-size:.9em;background:#0b1215;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink)}
  #viewer{position:fixed;inset:0;background:#000c;z-index:50;display:none;flex-direction:column}
  #viewer.on{display:flex}
  #viewer .vb{display:flex;gap:10px;align-items:center;padding:12px 18px;background:var(--side);border-bottom:1px solid var(--line)}
  #viewer .vb b{color:#fff;flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #viewer iframe{flex:1;border:0;background:#fff;width:100%}
  @media(max-width:900px){.f{grid-template-columns:28px 1fr}.f .sz,.f .dt{display:none}}
  .menu-t{display:none}
  @media(max-width:900px){
    body{display:block} aside{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px #000}
    aside.open{transform:none} main{height:auto}
    .menu-t{display:inline-flex;margin-bottom:10px;width:auto;padding:8px 14px}
    h1{font-size:30px} .two{grid-template-columns:1fr} .r{font-size:14px} .r.topic .w{flex-basis:84px}
  }
</style>
</head>

const KEY="pembelajaran-its-v1";
let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){done={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
const C=DATA.courses;
const tid=(c,i)=>c.id+"#"+i;
const prog=cs=>{const n=cs.reduce((a,c)=>a+c.topics.length,0);const k=cs.reduce((a,c)=>a+c.topics.filter((_,i)=>done[tid(c,i)]).length,0);return {n,k,p:n?Math.round(k/n*100):0}};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const ST={ok:["SELESAI","ok"],run:["BERJALAN","run"],plan:["RENCANA",""]};
let Q="";
function hl(t){t=esc(t);if(!Q)return t;const r=new RegExp("("+Q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");return t.replace(r,"<mark>$1</mark>")}
const row=(k,v,cls="",extra="")=>`<div class="r ${extra}"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`;

  ...DATA.semesters.map(s=>({grp:s.name+(s.status==="run"?" · berjalan":""),items:C.filter(c=>c.sem===s.n).map(c=>({id:"c-"+c.id,ic:c.status==="ok"?"✓":"○",t:c.name,c}))})),
  {grp:"Pendukung",items:[{id:"pendukung",ic:"✎",t:"Pelatihan & referensi"}]}
];
function renderMenu(){
  const cur=location.hash.slice(1)||"ringkasan";const ql=Q.toLowerCase();
  document.getElementById("menu").innerHTML=PAGES.map(g=>{
    const its=g.items.map(it=>{
      const hide=ql&&it.c&&!JSON.stringify(it.c).toLowerCase().includes(ql);
      const pc=it.c?prog([it.c]).p+"%":"";
      return `<button class="item ${cur===it.id?"active":""} ${hide?"hide":""}" data-id="${it.id}"><span class="ic">${it.ic}</span><span>${esc(it.t)}</span><span class="pc">${pc}</span></button>`}).join("");
    return `<div class="grp">${esc(g.grp)}</div>${its}`}).join("");
  const P=prog(C);document.getElementById("mypc").textContent=P.p+"%";document.getElementById("mybar").style.width=P.p+"%";
}
document.getElementById("menu").addEventListener("click",e=>{const b=e.target.closest(".item");if(!b)return;location.hash=b.dataset.id;document.getElementById("side").classList.remove("open")});

function vRingkasan(){
  const P=prog(C);const sks=DATA.semesters.filter(s=>s.status==="ok").reduce((a,s)=>a+(s.sks||0),0);
  let h=`<div class="eyebrow">Ikhtisar studi</div><h1>Peta Pembelajaran Semester 1 – 3</h1><hr class="rule">
  <p class="lead">Seluruh mata kuliah Magister Teknik Elektro ITS bidang Rekayasa Elektrik Berkelanjutan, disusun per semester dari folder kuliah. Pilih mata kuliah di panel kiri untuk membuka peta materinya; centang topik yang sudah dikuasai.</p>
  <div class="grid kpis">${[[C.length,"Mata kuliah"],[sks,"SKS selesai"],[C.filter(c=>c.status==="run").length,"Sedang berjalan"],[P.n,"Topik terpetakan"],[P.p+"%","Topik dikuasai"]].map(k=>`<div class="kpi"><div class="v">${k[0]}</div><div class="l">${k[1]}</div></div>`).join("")}</div>`;
  DATA.semesters.forEach(s=>{
    const cs=C.filter(c=>c.sem===s.n);const sp=prog(cs);
    h+=`<h2>${s.name} · ${esc(s.period)}</h2><div class="card">`+
      cs.map(c=>`<div class="r clink" data-go="c-${c.id}"><span class="k">${c.code} &nbsp;${esc(c.name)}</span><span class="v ${ST[c.status][1]}">${c.sks?c.sks+" SKS · ":""}${prog([c]).p}%</span></div>`).join("")+
      row(`Total ${s.name.toLowerCase()}`,`${s.sks??"–"} SKS · ${sp.k}/${sp.n} topik`)+`</div>`;
  });
  h+=`<p class="note">SKS semester 3 belum tercatat karena FRS semester berjalan belum ada di folder kuliah.</p>`;
  return h;
}
function vCourse(c){
  const s=DATA.semesters.find(x=>x.n===c.sem);const P=prog([c]);
  return `<div class="eyebrow">${esc(s.name)} · ${esc(c.code)}</div><h1>${hl(c.name)}</h1><hr class="rule">
  <p class="lead">${esc(c.thesis)}</p>
  <div>${c.tags.map(t=>`<span class="tag">${hl(t)}</span>`).join("")}</div>
  <h2>Identitas mata kuliah</h2><div class="card">
   ${row("Kode mata kuliah",esc(c.code))}${row("Beban studi",c.sks?c.sks+" SKS":"–")}${row("Dosen",esc(c.dosen))}${row("Periode",esc(s.period))}
   ${row("Status",ST[c.status][0],ST[c.status][1])}${row("Topik dikuasai",`${P.k} / ${P.n} · ${P.p} %`,P.p===100?"ok":"")}</div>
  <h2>Peta materi · klik untuk menandai dikuasai</h2><div class="card">
   ${c.topics.map((t,i)=>{const d=!!done[tid(c,i)];return `<div class="r topic ${d?"done":""}" data-t="${tid(c,i)}"><span class="w">${esc(t[0])}</span><span class="t">${hl(t[1])}</span><span class="ck">${d?"✓ dikuasai":"○"}</span></div>`}).join("")}</div>
  <div class="grid two">
   <div>${c.tasks.length?`<h2>Tugas &amp; evaluasi</h2><div class="card">${c.tasks.map((x,i)=>row(hl(x),String(i+1).padStart(2,"0"))).join("")}</div>`:""}</div>
   <div>${c.refs.length?`<h2>Bahan rujukan utama</h2><div class="card">${c.refs.map((x,i)=>row(hl(x),"R"+(i+1))).join("")}</div>`:""}</div>
  </div>
  <h2>Lokasi file</h2><div class="path">${esc(ROOT+c.folder)}</div>
  ${c.folder.startsWith("(")?"":`<div class="dhead"><h2>File di Google Drive</h2><div class="row" style="display:flex;gap:10px;align-items:center"><span class="live" id="dlive"><span class="pulse"></span><span id="dstat">memuat…</span></span><button class="sbtn" data-drefresh>↻ Muat ulang</button></div></div><div id="dbox"></div>`}`;
}
function vTesis(){
  return `<div class="eyebrow">Jalur tesis</div><h1>Hosting Capacity Jaringan 20 kV dengan EV dan PLTS Atap</h1><hr class="rule">
  <p class="lead">Lokasi studi jaringan 20 kV PLN UP3 Ciracas (penyulang GI Gandaria), dianalisis dengan Quasi-Static Time Series (QSTS) di DIgSILENT PowerFactory.</p>
  <h2>Linimasa</h2><div class="card tl">${DATA.timeline.map(x=>`<div class="r"><span class="k"><span class="dot ${x.s}"></span>${esc(x.t)}</span><span class="v ${x.s==="now"?"run":x.s==="done"?"ok":""}">${esc(x.d)}</span></div>`).join("")}</div>
  <h2>Mata kuliah penopang</h2><div class="card">${C.map(c=>`<div class="r clink" data-go="c-${c.id}"><span class="k">${esc(c.thesis)}</span><span class="v">${esc(c.name.length>34?c.name.slice(0,32)+"…":c.name)}</span></div>`).join("")}</div>`;
}
function vBenang(){
  return `<div class="eyebrow">Peta belajar</div><h1>Benang Merah Antar Mata Kuliah</h1><hr class="rule">
  <p class="lead">Urutan belajar yang disarankan untuk mengulang materi per tema — mengikuti bagaimana materi saling membangun dari semester 1 ke semester 3 dan bermuara ke tesis.</p>
  <div class="card">${DATA.threads.map(t=>`<div class="thread"><b>${esc(t.t)}</b><div style="color:var(--muted)">${esc(t.d)}</div><div class="chain">${t.chain.map(n=>`<span class="n">${esc(n)}</span>`).join('<span class="a">→</span>')}</div></div>`).join("")}</div>`;
}
function vPendukung(){
  return `<div class="eyebrow">Pendukung</div><h1>Pelatihan &amp; Referensi</h1><hr class="rule">
  <p class="lead">Kegiatan belajar di luar mata kuliah resmi yang menopang tesis dan pekerjaan.</p>`+
  DATA.extras.map(x=>`<h2>${esc(x.name)}</h2><div class="card">${x.items.map((i,n)=>row(esc(i),String(n+1).padStart(2,"0"))).join("")}</div><p class="note"></p><div class="path">${esc(ROOT+x.folder)}</div>`).join("");
}
let rendered=null,lastCJ=null;
function render(){
  const id=location.hash.slice(1)||"ringkasan";let h;
  if(id.startsWith("c-")){const c=C.find(x=>"c-"+x.id===id);h=c?vCourse(c):vRingkasan()}
  else h=({tesis:vTesis,benang:vBenang,pendukung:vPendukung,drive:vDrive,"drive-set":vDriveSet}[id]||vRingkasan)();
  document.getElementById("view").innerHTML=h;renderMenu();const a=document.querySelector(".item.active");if(a)a.scrollIntoView({block:"nearest"});
  if(id.startsWith("c-")){const c=C.find(x=>"c-"+x.id===id);if(c&&!c.folder.startsWith("(")){if(rendered===id&&lastCJ)renderCourseDrive(lastCJ);else{lastCJ=null;loadCourseDrive(c)}}}
  rendered=id;
}
document.getElementById("view").addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t){const k=t.dataset.t;done[k]?delete done[k]:done[k]=1;save();render();return}
  const g=e.target.closest("[data-go]");if(g)location.hash=g.dataset.go;
});
window.addEventListener("hashchange",()=>{render();document.getElementById("main").scrollTop=0});
document.getElementById("q").addEventListener("input",e=>{Q=e.target.value.trim();render()});
let armed=false;document.getElementById("reset").addEventListener("click",e=>{const b=e.currentTarget;if(!armed){armed=true;b.textContent="Klik lagi untuk konfirmasi";setTimeout(()=>{armed=false;b.innerHTML="↺ &nbsp;Atur ulang centang"},3000);return}armed=false;done={};save();b.innerHTML="↺ &nbsp;Atur ulang centang";render()});
document.getElementById("mt").addEventListener("click",()=>document.getElementById("side").classList.toggle("open"));

/* ================= GOOGLE DRIVE (langsung) ================= */
const DRIVE_URL_DEFAULT = "";   // boleh diisi URL Web App Apps Script (/exec); kunci tetap dimasukkan di perangkat
const DKEY="pembelajaran-drive-cfg";
function dcfg(){let c={};try{c=JSON.parse(localStorage.getItem(DKEY)||"{}")}catch(e){}return {url:c.url||DRIVE_URL_DEFAULT,key:c.key||""}}
function dsave(c){try{localStorage.setItem(DKEY,JSON.stringify(c))}catch(e){}}
const dready=()=>{const c=dcfg();return !!(c.url&&c.key)};
async function dget(params){
  const c=dcfg();const u=new URL(c.url);u.searchParams.set("key",c.key);u.searchParams.set("_",Date.now());
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString(),{cache:"no-store",redirect:"follow"});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"Gagal membaca Drive");return j;
}
const fmtSize=b=>!b?"–":b<1024?b+" B":b<1048576?(b/1024).toFixed(0)+" KB":b<1073741824?(b/1048576).toFixed(1)+" MB":(b/1073741824).toFixed(2)+" GB";
const fmtDate=d=>{try{return new Date(d).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})}catch(e){return ""}};
const fmtTime=d=>new Date(d).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
function ftype(f){const m=f.mime||"",n=(f.name||"").toLowerCase();
  if(m.includes("pdf")||n.endsWith(".pdf"))return["PDF","pdf"];
  if(m.includes("document")||m.includes("word")||/\.docx?$/.test(n))return["DOC","doc"];
  if(m.includes("sheet")||m.includes("excel")||/\.(xlsx?|csv)$/.test(n))return["XLS","xls"];
  if(m.includes("presentation")||m.includes("powerpoint")||/\.pptx?$/.test(n))return["PPT","ppt"];
  if(m.startsWith("video/"))return["VID","vid"];if(m.startsWith("image/"))return["IMG","img"];
  const e=n.includes(".")?n.split(".").pop().slice(0,4).toUpperCase():"FILE";return[e,""]}
function previewUrl(f){const m=f.mime||"";
  if(m==="application/vnd.google-apps.document")return`https://docs.google.com/document/d/${f.id}/preview`;
  if(m==="application/vnd.google-apps.spreadsheet")return`https://docs.google.com/spreadsheets/d/${f.id}/preview`;
  if(m==="application/vnd.google-apps.presentation")return`https://docs.google.com/presentation/d/${f.id}/preview`;
  return`https://drive.google.com/file/d/${f.id}/preview`}
let FILES={};
function fileRows(j,opts={}){
  FILES={};let h="";
  (j.folders||[]).forEach(d=>{h+=`<div class="f dir" data-dir="${d.id}"><span class="ty">DIR</span><span class="nm">${esc(d.name)}</span><span class="sz">folder</span><span class="dt">${fmtDate(d.modified)}</span></div>`});
  (j.files||[]).forEach(f=>{FILES[f.id]=f;const t=ftype(f);
    h+=`<div class="f" data-file="${f.id}"><span class="ty ${t[1]}">${esc(t[0])}</span><span class="nm">${hl(f.name)}${f.folder!==undefined?`<small>${esc(f.folder||"MATERI KULIAH")}</small>`:""}</span><span class="sz">${fmtSize(f.size)}</span><span class="dt">${fmtDate(f.modified)}</span></div>`});
  return h||`<div class="empty">Folder ini kosong.</div>`;
}
function setLive(ok,msg){const l=document.getElementById("dlive"),s=document.getElementById("dstat");if(!l)return;l.classList.toggle("err",!ok);s.textContent=msg}
function needSetup(){return `<div class="card"><div class="empty">Drive belum terhubung. Buka <a href="#drive-set" style="color:var(--acc)">Pengaturan Drive</a> untuk memasukkan URL Apps Script dan kunci akses.</div></div>`}
function errBox(e){return `<div class="card"><div class="empty" style="color:#f08a84">Gagal membaca Drive: ${esc(e.message||e)}<br><span style="color:var(--muted)">Periksa URL/kunci di Pengaturan Drive, atau pastikan Web App di-deploy dengan akses "Anyone".</span></div></div>`}

/* --- isi Drive pada halaman mata kuliah --- */
let dCourse=null;
async function loadCourseDrive(c,silent){
  const box=document.getElementById("dbox");if(!box)return;
  if(!dready()){box.innerHTML=needSetup();setLive(false,"belum terhubung");return}
  dCourse={path:c.folder.replace(/\\/g,"/"),id:null};
  if(!silent)box.innerHTML=`<div class="card"><div class="empty">Membaca folder dari Google Drive…</div></div>`;
  try{const j=await dget({path:dCourse.path});renderCourseDrive(j)}
  catch(e){box.innerHTML=errBox(e);setLive(false,"gagal terhubung")}
}
async function openCourseDir(id){const box=document.getElementById("dbox");dCourse.id=id;
  try{const j=await dget({id});renderCourseDrive(j)}catch(e){box.innerHTML=errBox(e)}}
function renderCourseDrive(j){
  const box=document.getElementById("dbox");if(!box)return;lastCJ=j;
  const cr=(j.crumbs||[]).slice(1);
  box.innerHTML=`<div class="crumbs">${cr.map((x,i)=>i<cr.length-1?`<a data-cdir="${x.id}">${esc(x.name)}</a> /`:`<span style="color:var(--ink)">${esc(x.name)}</span>`).join(" ")}</div><div class="card">${fileRows(j)}</div>`;
  setLive(true,"tersinkron "+fmtTime(j.time)+` · ${(j.files||[]).length} file`);
}

/* --- halaman penjelajah Drive --- */
let dCur=null;
function vDrive(){
  setTimeout(()=>loadDrive(dCur),0);
  return `<div class="eyebrow">Google Drive · langsung</div><h1>File Materi Kuliah</h1><hr class="rule">
  <p class="lead">Isi folder <b style="color:#fff">MATERI KULIAH</b> di Google Drive Anda, dibaca langsung setiap kali dibuka dan diperbarui otomatis tiap 60 detik. Klik file untuk membacanya di dalam dashboard.</p>
  <div class="dhead"><h2 id="dtitle">MATERI KULIAH</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
   <span class="live" id="dlive"><span class="pulse"></span><span id="dstat">memuat…</span></span>
   <input id="dq" placeholder="cari nama file di Drive…" style="background:var(--card);border:1px solid var(--line2);border-radius:7px;color:var(--ink);font:13px var(--mono);padding:7px 10px;width:230px">
   <button class="sbtn" data-drefresh>↻ Muat ulang</button></div></div>
  <div id="dcrumbs" class="crumbs"></div><div id="dlist"></div>`;
}
async function loadDrive(id,silent){
  const list=document.getElementById("dlist");if(!list)return;
  if(!dready()){list.innerHTML=needSetup();setLive(false,"belum terhubung");return}
  dCur=id||null;if(!silent)list.innerHTML=`<div class="card"><div class="empty">Membaca Google Drive…</div></div>`;
  try{const j=await dget(id?{id}:{});
    document.getElementById("dcrumbs").innerHTML=(j.crumbs||[]).map((x,i,a)=>i<a.length-1?`<a data-ddir="${x.id}">${esc(x.name)}</a> /`:`<span style="color:var(--ink)">${esc(x.name)}</span>`).join(" ");
    document.getElementById("dtitle").textContent=j.folder.name;
    list.innerHTML=`<div class="card">${fileRows(j)}</div>`;
    setLive(true,"tersinkron "+fmtTime(j.time)+` · ${(j.folders||[]).length} folder, ${(j.files||[]).length} file`);
  }catch(e){list.innerHTML=errBox(e);setLive(false,"gagal terhubung")}
}
let dqTimer;
async function searchDrive(q){
  const list=document.getElementById("dlist");if(!q){loadDrive(dCur);return}
  list.innerHTML=`<div class="card"><div class="empty">Mencari "${esc(q)}" di Drive…</div></div>`;
  try{const j=await dget({q});document.getElementById("dcrumbs").innerHTML=`<span>Hasil pencarian: ${(j.files||[]).length} file</span>`;
    const keep=Q;Q=q;list.innerHTML=`<div class="card">${fileRows(j)}</div>`;Q=keep;setLive(true,"tersinkron "+fmtTime(j.time))}
  catch(e){list.innerHTML=errBox(e)}
}

/* --- pengaturan --- */
function vDriveSet(){
  const c=dcfg();
  return `<div class="eyebrow">Google Drive · pengaturan</div><h1>Hubungkan Dashboard ke Drive</h1><hr class="rule">
  <p class="lead">Folder MATERI KULIAH tetap privat. Dashboard membacanya melalui Apps Script yang berjalan di akun Google Anda dan hanya menjawab permintaan yang membawa kunci akses. URL dan kunci disimpan di browser ini saja, tidak masuk ke repo publik.</p>
  <h2>Koneksi</h2><div class="card" style="padding:20px">
   <label class="field"><span>URL Web App Apps Script (berakhiran /exec)</span><input id="cfurl" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
   <label class="field"><span>Kunci akses</span><input id="cfkey" value="${esc(c.key)}" placeholder="kunci dari Execution log fungsi setup"></label>
   <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="sbtn pri" id="cfsave">Simpan &amp; uji koneksi</button><button class="sbtn" id="cfclear">Hapus dari browser ini</button><span class="live" id="dlive"><span class="pulse"></span><span id="dstat">${dready()?"tersimpan":"belum diatur"}</span></span></div>
  </div>
  <h2>Pemasangan Apps Script (sekali saja, ±5 menit)</h2><div class="card" style="padding:20px"><ol class="steps">
   <li>Buka <a href="https://script.google.com" target="_blank" rel="noopener" style="color:var(--acc)">script.google.com</a> dengan akun pemilik Drive, lalu klik <b>New project</b>.</li>
   <li>Hapus isi editor, tempel seluruh isi file <code>apps-script/Code.gs</code> dari repo PEMBELAJARAN-, lalu simpan.</li>
   <li>Pilih fungsi <code>setup</code> → <b>Run</b> → izinkan akses Google Drive. Salin <b>kunci akses</b> yang muncul di Execution log.</li>
   <li>Klik <b>Deploy → New deployment</b> → tipe <b>Web app</b>. Execute as: <b>Me</b>. Who has access: <b>Anyone</b>. Klik Deploy, lalu salin URL Web app.</li>
   <li>Tempel URL dan kunci di kotak di atas, lalu klik <b>Simpan &amp; uji koneksi</b>.</li></ol>
   <p class="note">Bila kode skrip diubah nanti, buat ulang lewat <b>Deploy → Manage deployments → Edit → New version</b> agar URL tetap sama. Perubahan isi Drive tidak perlu deploy ulang — langsung terbaca.</p></div>`;
}

/* --- penampil file --- */
function openFile(id){const f=FILES[id];if(!f)return;
  document.getElementById("vtitle").textContent=f.name;document.getElementById("vopen").href=f.url||`https://drive.google.com/file/d/${f.id}/view`;
  document.getElementById("vframe").src=previewUrl(f);document.getElementById("viewer").classList.add("on")}
document.getElementById("vclose").addEventListener("click",()=>{document.getElementById("viewer").classList.remove("on");document.getElementById("vframe").src="about:blank"});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("vclose").click()});

/* --- event --- */
document.getElementById("view").addEventListener("click",async e=>{
  const f=e.target.closest("[data-file]");if(f){openFile(f.dataset.file);return}
  const d=e.target.closest("[data-dir]");if(d){(location.hash==="#drive")?(document.getElementById("dq").value="",loadDrive(d.dataset.dir)):openCourseDir(d.dataset.dir);return}
  const dd=e.target.closest("[data-ddir]");if(dd){loadDrive(dd.dataset.ddir);return}
  const cd=e.target.closest("[data-cdir]");if(cd){openCourseDir(cd.dataset.cdir);return}
  if(e.target.closest("[data-drefresh]")){driveTick(false);return}
  if(e.target.id==="cfsave"){const url=document.getElementById("cfurl").value.trim(),key=document.getElementById("cfkey").value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){setLive(false,"URL harus dari script.google.com");return}
    dsave({url,key});setLive(true,"menguji…");
    try{const j=await dget({});setLive(true,`terhubung · ${j.folder.name} · ${(j.folders||[]).length} folder`)}catch(err){setLive(false,"gagal: "+err.message)}}
  if(e.target.id==="cfclear"){try{localStorage.removeItem(DKEY)}catch(_){}render()}
});
document.getElementById("view").addEventListener("input",e=>{if(e.target.id==="dq"){clearTimeout(dqTimer);const v=e.target.value.trim();dqTimer=setTimeout(()=>searchDrive(v),500)}});

/* --- pembaruan otomatis tiap 60 detik --- */
function driveTick(silent=true){
  if(document.hidden||!dready())return;
  const id=location.hash.slice(1);
  if(id==="drive"){const q=(document.getElementById("dq")||{}).value;if(!q)loadDrive(dCur,silent)}
  else if(id.startsWith("c-")&&document.getElementById("dbox")){
    if(dCourse&&dCourse.id)openCourseDir(dCourse.id);else{const c=C.find(x=>"c-"+x.id===id);if(c)loadCourseDrive(c,silent)}}
}
setInterval(()=>driveTick(true),60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)driveTick(true)});

render();
</script>
